# Railway: set service Root directory to `apps/api` when the repo is the monorepo.

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-9_x"]

[phases.install]
cmds = [
  "npm install -g corepack@0.24.1 && corepack enable",
  "pnpm install --no-frozen-lockfile",
]

[phases.build]
cmds = ["pnpm build"]

[variables]
NODE_ENV = "production"

[start]
cmd = "node dist/main"

# Railway API service config (standalone api repo).

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-9_x"]

[phases.install]
cmds = [
  "npm install -g corepack@0.24.1 && corepack enable",
  "pnpm install --no-frozen-lockfile --prod=false",
]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "node dist/main"

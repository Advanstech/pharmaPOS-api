"""
A product in the Azzay Pharmacy catalogue. Products are scoped to an organisation and can be available at `pharmaceutical`, `chemical`, or `both` branch types. When no approved `product_images` row exists, the web POS uses a deterministic Unsplash stock-photo fallback from id, name, generic name, and category.
"""
type ProductType {
  """Barcode (EAN-13 or custom). Used for barcode scanner at POS."""
  barcode: String

  """
  Which branch type can sell this product. Values: `pharmaceutical` | `chemical` | `both`. Ghana FDA: POM and CONTROLLED products are always `pharmaceutical` only.
  """
  branchType: String!

  """Product category"""
  category: ProductCategoryType

  """
  Ghana FDA classification. Values:
  - `OTC` — Over the counter, no prescription needed
  - `POM` — Prescription Only Medicine, requires approved Rx
  - `CONTROLLED` — Controlled drug, requires two pharmacist sign-offs
  """
  classification: String!

  """Generic/INN name. Example: `"Paracetamol"`, `"Amoxicillin"`"""
  genericName: String

  """UUID of the product"""
  id: ID!

  """
  Approved image row when present. Null if none; web POS shows a deterministic stock-photo fallback from product id/name/generic/category.
  """
  image: ProductImageType

  """
  Inventory position at the current branch. Null if queried without branch context.
  """
  inventory: ProductInventoryType

  """Brand/trade name. Example: `"Paracetamol 500mg"`, `"Amoxil 250mg/5ml"`"""
  name: String!

  """
  Ghana FDA: `true` if an approved prescription is required before this product can be sold. Attempting to sell without a prescription throws `FDA_POM_VIOLATION`.
  """
  requiresRx: Boolean!

  """
  Primary supplier. Enables full supply chain traceability per Ghana FDA requirements.
  """
  supplier: ProductSupplierType

  """
  Unit selling price in **GHS pesewas** (integer). Example: GH₵12.50 = `1250`. Always GHS — never USD.
  """
  unitPrice: Int!

  """
  Ghana GRA: `true` if this product is VAT-exempt. Prescription medicines (`requiresRx = true`) are VAT-exempt. OTC products are subject to 15% VAT.
  """
  vatExempt: Boolean!
}

